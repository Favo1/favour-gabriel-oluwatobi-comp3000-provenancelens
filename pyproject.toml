[project]
name = "provenancelens"
version = "0.1.0"
description = "Detecting AI-generated and AI-edited images (COMP3000 final-year project)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
